<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Elicia's World</title>
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>🌷</text></svg>"
    />
  </head>
  <body>
    <div class="card-container">
      <header class="section-header">
        <h1 class="title">Welcome to Elicia's world</h1>
        <p class="subtitle">
          Hi, I'm Elicia! This is my little home on the internet. Click through
          to explore what's happening.
        </p>
      </header>
      <a href="projects.html" class="card">
        <div class="image-wrapper img-icon">
          <img src="images/bear.jpg" alt="Icon 1" />
        </div>
        <p class="card-text">Projects</p>
      </a>
      <a href="dispatch.html" class="card">
        <div class="image-wrapper img-icon">
          <img src="images/dispatch.gif" alt="vintage tv screen" />
        </div>
        <p class="card-text">Dispatch</p>
      </a>
      <a href="https://elicias-digi-garden.vercel.app" class="card">
        <div class="image-wrapper img-icon">
          <img src="images/garden.png" alt="Garden reflection in water" />
        </div>
        <p class="card-text">Garden</p>
      </a>
      <a href="contact.html" class="card">
        <div class="image-wrapper">
          <img src="images/phone.png" class="fit-image" alt="Nokia phone" />
        </div>
        <p class="card-text">Contact</p>
      </a>
      <a href="collections.html" class="card">
        <div class="image-wrapper img-icon">
          <img src="images/collection.webp" alt="Icon 5" />
        </div>
        <p class="card-text">Collection</p>
      </a>
      <a href="archive.html" class="card">
        <div class="image-wrapper img-icon">
          <img src="images/archive.webp" alt="File cabinets" />
        </div>
        <p class="card-text">Archive</p>
      </a>
    </div>
  </body>
</html>
